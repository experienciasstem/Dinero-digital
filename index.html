main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.day{align-self:center;background:var(--pill);padding:5px 14px;border-radius:8px;font-size:13px;color:var(--ink);margin-bottom:6px}
.row{display:flex;gap:10px;align-items:flex-start}
.bubble{flex:1;min-width:0;max-width:340px;background:var(--bubble);border-radius:4px 14px 14px 14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 1.5px rgba(0,0,0,.12)}
.play{width:34px;height:34px;border:1px solid var(--track);border-radius:4px;background:var(--bubble);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.play:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.play svg{width:22px;height:22px;fill:#444} .i-pause{display:none}
.playing .i-play{display:none} .playing .i-pause{display:inline}
.track{flex:1;min-width:0}
.bar{position:relative;height:3px;background:var(--track);border-radius:2px;margin:10px 0 10px;cursor:pointer}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--green);border-radius:2px}
.dot{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--green)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mic{width:34px;height:34px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.mic svg{width:18px;height:18px;fill:#fff}
footer{display:flex;gap:10px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0}
.input{flex:1;min-width:0;background:#fff;border-radius:24px;display:flex;align-items:center;gap:12px;padding:10px 14px;color:var(--muted);font-size:15px;box-shadow:0 1px 1.5px rgba(0,0,0,.1)}
.input svg{width:22px;height:22px;fill:var(--muted);flex:none} .input span{flex:1}
.send{width:50px;height:50px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none} .send svg{width:24px;height:24px;fill:#fff}

<script>
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const bubbles=[...document.querySelectorAll(".bubble")];
bubbles.forEach((b,i)=>{
  const a=b.querySelector("audio"),btn=b.querySelector(".play"),fill=b.querySelector(".fill"),dot=b.querySelector(".dot"),dur=b.querySelector(".dur"),bar=b.querySelector(".bar");
  const set=p=>{fill.style.width=p+"%";dot.style.left=p+"%"};
  btn.onclick=()=>{ if(a.paused){bubbles.forEach(o=>{const x=o.querySelector("audio");if(x!==a)x.pause()});a.play()}else a.pause()};
  a.onplay=()=>btn.classList.add("playing");
  a.onpause=()=>btn.classList.remove("playing");
  a.ontimeupdate=()=>{if(a.duration){set(a.currentTime/a.duration*100);dur.textContent=fmt(a.currentTime)}};
  a.onended=()=>{set(0);dur.textContent=dur.dataset.d;const n=bubbles[i+1];if(n)n.querySelector(".play").click()};
  bar.onclick=e=>{if(!a.duration)return;const r=bar.getBoundingClientRect();a.currentTime=(e.clientX-r.left)/r.width*a.duration;if(a.paused)a.play()};
});
</script>
